<style>
/* Layout: one narrow column. Add line, search, then the log. Everything else stays folded until asked for. */
:root{
  --bg:#EDF3F2;--surface:#F9FCFB;--ink:#0F2A33;--muted:#4F6B74;--line:#C8D8D8;
  --accent:#C8420C;--on-accent:#FFFFFF;--sea:#0C6878;--sea-soft:#D6E8E9;--uw:#1E8BD6;--mark:#FFD9BF;--danger:#A9231C;--good:#1B7F4B;--amber:#B47A00;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08222B;--surface:#0E2E38;--ink:#E3F0EF;--muted:#94B2B7;--line:#21505B;
  --accent:#FF7A33;--on-accent:#08222B;--sea:#57C4D1;--sea-soft:#14414D;--uw:#4FB6F0;--mark:#7A3A12;--danger:#FF8A80;--good:#5FD39A;--amber:#F4C04E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08222B;--surface:#0E2E38;--ink:#E3F0EF;--muted:#94B2B7;--line:#21505B;
  --accent:#FF7A33;--on-accent:#08222B;--sea:#57C4D1;--sea-soft:#14414D;--uw:#4FB6F0;--mark:#7A3A12;--danger:#FF8A80;--good:#5FD39A;--amber:#F4C04E;color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 clamp(19px,4.5vw,26px)/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
header{display:flex;gap:12px;align-items:center;justify-content:space-between}
.gear{flex:none;border:1px solid transparent;border-radius:8px;padding:7px;line-height:0;color:var(--ink)}
.sheet{width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0}
.sheet::backdrop{background:rgba(4,20,26,.5)}
.sheet-in{display:grid;gap:18px;padding:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x-close{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-6px -8px -6px 12px;border-radius:50%;color:var(--muted)}
.x-close:hover{color:var(--ink);background:var(--sea-soft)}
.x-close:focus-visible{outline:2px solid var(--sea);outline-offset:1px}

.sheet-head h2{margin:0;font:500 17px var(--display)}
.set-sec{display:grid;gap:8px}
.sc-d{width:min(440px,calc(100vw - 24px))}
.sc-d .sheet-in{gap:12px;max-height:calc(100dvh - 26px);overflow-y:auto}
.sc-wrap{position:relative;line-height:0;width:min(calc(100% - 88px),calc(48dvh * 9 / 16),247px);aspect-ratio:9/16;height:auto}
.sc-wrap.post{aspect-ratio:4/5;width:min(calc(100% - 88px),calc(40dvh * 4 / 5),288px)}
.sc-wrap canvas{width:100%;height:100%;border-radius:10px;background:var(--sea-soft);box-shadow:0 4px 18px rgba(4,20,26,.25)}
.sc-busy{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
.sc-stage{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.sc-arr{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:36px;height:36px;border-radius:50%;background:var(--sea-soft);color:var(--ink);display:grid;place-items:center}
.sc-arr:hover{background:var(--line)}
.sc-arr[hidden]{display:grid!important;visibility:hidden}
.sc-ic{display:inline-flex;align-items:center;gap:2px}
.sc-ic .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sc-n{position:absolute;right:8px;top:8px;background:rgba(4,20,26,.55);color:#fff;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px}
.sc-wrap.drag canvas{cursor:grab;touch-action:none}
.sc-fit{display:flex;gap:8px;justify-content:center}
.sc-fit button{padding:6px 14px;font-size:13.5px}
.sc-h2{margin:-4px 0 0;text-align:center;font-size:12.5px}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chips:empty{display:none}
.sc-chip{padding:5px 11px;border-radius:999px;font-size:13.5px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.sc-chip small{color:var(--muted);font-size:11.5px;margin-left:3px}
.sc-chip.on{background:var(--sea);border-color:var(--sea);color:var(--on-accent)}
.sc-chip.on small{color:inherit;opacity:.75}
.sc-row{display:grid;gap:6px}
.sc-lab{font-size:12.5px;color:var(--muted)}
.sc-chk{display:flex;flex-wrap:wrap;gap:4px 14px}
.sc-btns{display:flex;gap:8px}
.sc-btns button{flex:1}
.so-d .sheet-in{gap:14px}
.gear{position:relative}
.gear-b{position:absolute;top:0;right:-2px;margin:0;pointer-events:none}
.so-pw{display:grid;gap:6px;background:var(--bg)}
.so-pics a,.so-pics img{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.so-pics img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;cursor:zoom-in}
.so-pics{aspect-ratio:1}
.so-dots{width:calc(var(--n) * 22px);overflow:hidden;justify-self:center;margin-top:2px}
.so-dr{display:flex;transition:transform .25s ease}
.so-dot{flex:0 0 22px;display:grid;place-items:center;height:14px;opacity:.38;transition:transform .25s ease,opacity .25s}
.so-dot .fi{width:18px;height:10px}
.so-dot.on{opacity:1}
.so-dot.s{transform:scale(.72)}.so-dot.xs{transform:scale(.48)}.so-dot.h{transform:scale(0);opacity:0}
.so-post .so-cs li{flex-wrap:nowrap}
.so-post .so-cn{flex:1 1 auto}
.so-post .so-cn b,.so-post .so-cn i{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-post .so-cm{flex-direction:column;align-items:flex-end;gap:2px;flex:0 1 auto;max-width:52%;text-align:right;line-height:1.25;margin-left:0}
.so-post .so-cm span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.so-post .so-cf{padding-right:0}
.so-send{all:unset;box-sizing:border-box;flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:opacity .15s}
.so-send:disabled{opacity:.3;cursor:default}
.so-send:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.so-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.so-me{display:grid;gap:12px}
.so-avb{all:unset;position:relative;cursor:pointer;border-radius:50%;line-height:0;flex:none}
.so-avb:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.so-cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.so-tt input.so-name,.so-tt input.so-user{border:1px solid transparent;background:transparent;padding:3px 6px;margin-left:-7px;border-radius:6px;width:100%}
.so-tt input.so-name{font:600 19px var(--display)}
.so-tt input.so-user{color:var(--muted);font-size:14px}
.so-tt input.so-name:hover,.so-tt input.so-user:hover{border-color:var(--line)}
.so-tt input.so-name:focus,.so-tt input.so-user:focus{border-color:var(--sea);background:var(--bg);outline:none}
.so-tt{gap:2px}
.so-tt .so-uw>span{left:-1px;font-size:14px}
.so-tt .so-uw input.so-user{padding-left:16px}
#setProfile .so-tt input{min-height:0;height:auto}
.so-tt .so-us{min-height:1.25em;font-size:12px}
.so-post .so-cm{font-size:13px}
.so-h{margin:-4px 0 4px 30px;font-size:12.5px}
@media (hover:hover) and (pointer:fine){[data-share]{display:none!important}}

.so-tabs{display:flex;gap:3px;background:var(--sea-soft);border-radius:10px;padding:3px}
.so-tabs button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;justify-content:center;align-items:center;gap:4px}
.so-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(4,20,26,.18)}
.so-tabs button:focus-visible{outline:2px solid var(--sea)}
.so-view{display:grid;gap:14px;min-width:0;align-content:start}
.so-badge{min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 10.5px/17px system-ui,sans-serif;text-align:center;padding:0 4px;margin-left:4px;box-sizing:border-box}
.so-av{flex:none;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:hsl(var(--h) 38% 42%);color:#fff;font:600 14px var(--display);letter-spacing:.02em}
.so-av-l{width:68px;height:68px;font-size:24px}
.so-post{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;display:grid;min-width:0}
.so-hd{padding:10px 12px 8px}
.so-who{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.so-who:focus-visible{outline:2px solid var(--sea);border-radius:8px}
.so-wt{display:grid;min-width:0;line-height:1.25}
.so-wt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-wt small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.so-pics{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:2px;background:var(--sea-soft);scrollbar-width:none}
.so-pics::-webkit-scrollbar{display:none}
.so-cs{list-style:none;margin:0;padding:10px 12px 4px;display:grid;gap:8px}
.so-cs li{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.so-cs .fi{width:48px;height:27px;flex:none}
.so-cn{display:grid;min-width:0;flex:1 1 140px;line-height:1.25}
.so-cn i{font-size:12.5px;color:var(--muted)}
.so-x{color:var(--muted);font-weight:500}
.so-cm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-left:auto}
.so-cm span{white-space:nowrap}
.so-act{display:flex;gap:2px;padding:0 4px}
.so-act button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:8px;border-radius:8px;color:var(--ink);font-size:14px;font-weight:600;min-height:40px}
.so-act button:hover{background:var(--sea-soft)}
.so-act button:focus-visible{outline:2px solid var(--sea)}
.so-like.on{color:var(--accent)}
.so-like.on path,.so-ai.on path{fill:currentColor}
.so-coms{padding:0 12px 6px;display:grid;gap:6px;font-size:14px;line-height:1.4}
.so-c{word-break:break-word;display:flex;gap:4px;align-items:baseline}
.so-c>span{flex:1;min-width:0}
.so-c b{cursor:pointer;flex:none}
.so-cx{all:unset;cursor:pointer;color:var(--muted);padding:0 6px;font-size:17px;line-height:1}
.so-cx:hover{color:var(--danger)}
.so-all{justify-self:start;font-size:13.5px}
.so-post .so-cf{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:6px 0 0;margin:2px 0 0}
.so-cf input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:14px}
.so-cf input:focus{outline:none}
.so-cf button{font-weight:600}
.so-moreb{justify-self:center}
#soPP{display:grid;gap:14px}
.so-empty{text-align:center;color:var(--muted);padding:28px 8px;display:grid;gap:12px;justify-items:center}
.so-empty p{margin:0;max-width:34ch}
.so-q{position:relative;display:block}
.so-qi{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);line-height:0}
.so-q input{width:100%;padding-left:36px;box-sizing:border-box}
.so-list{list-style:none;margin:0;padding:0;display:grid}
.so-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.so-list>.so-row:first-child{border-top:0}
.so-list>li.hint{padding:4px 0}
.so-fb{flex:none;white-space:nowrap}
.so-fb-s{padding:6px 12px;font-size:13.5px}
.so-pend{color:var(--muted)}
.so-warn{color:var(--danger);border-color:var(--danger)}
.so-rb{display:inline-flex;gap:6px;flex:none}
.so-rb button{padding:6px 10px;font-size:13.5px}
.so-ar.new .so-wt>span{font-weight:600}
.so-ai{flex:none;color:var(--muted);line-height:0}
.so-ai.on{color:var(--accent)}
.so-top{display:flex;gap:16px;align-items:center;min-width:0}
.so-tt{display:grid;gap:4px;min-width:0}
.so-tt h3{margin:0;font:600 19px var(--display);overflow-wrap:anywhere}
.so-tt p{margin:0}
.so-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.so-stats span{display:grid;font-size:12.5px;color:var(--muted);line-height:1.2}
.so-stats b{font-size:16px;color:var(--ink)}
.so-pa{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.so-pa .so-fb{min-width:130px}
.so-tag{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.so-req{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--sea-soft)}
.so-req span{flex:1 1 100%;font-weight:600}
.so-back{display:inline-flex;align-items:center;gap:2px;justify-self:start;margin-left:-6px}
.so-note{margin:0;padding:10px 12px;border-radius:10px;background:var(--mark);color:var(--ink);font-size:14px}
.so-sec{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.so-sec h3{margin:0;font:600 14.5px var(--display)}
.so-sec label:not(.chk){display:grid;gap:4px}
.so-fd summary{cursor:pointer;font:600 14.5px var(--display)}
.so-fd:not([open]){gap:0}
.so-uw{display:flex;align-items:center;gap:0;position:relative}
.so-uw>span{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.so-uw input{flex:1;min-width:0;padding-left:26px}
.so-us{font-size:12.5px;min-height:1em}
.so-us.ok{color:var(--good)}.so-us.bad{color:var(--danger)}
.fr-body{display:grid;gap:10px}
.fr-opts{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0;display:grid;gap:6px}
.fr-opts legend{font-size:12.5px;color:var(--muted);padding:0 4px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
label.chk input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent)}
.fr-code{font-family:ui-monospace,monospace;letter-spacing:.08em}
.fr-link{font-size:13px;color:var(--muted)}
.fr-b{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.fr-add input{flex:1;min-width:150px}
.fr-ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fr-ul li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.fr-n{font-weight:600}
.fr-sp{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.fr-sp>li{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fr-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fr-h svg{flex:none}
.fr-c{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.fr-it{display:grid;gap:6px;margin-top:6px}
.fr-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.fr-row span{flex-basis:100%}
.fr-row img{width:84px;height:64px;object-fit:cover;border-radius:6px;display:block}

.set-sec h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;overflow-wrap:anywhere}
.set-list{display:grid;gap:6px}
.set-list button{text-align:left;font-weight:400}
.set-sec select{width:auto;justify-self:start;min-width:120px}
.set-sec .lang{justify-self:start;width:max-content}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:6px 14px;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--sea);color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
label,.lbl{display:grid;align-content:start;gap:4px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:6px;padding:9px 13px;font-weight:500}
button:hover{border-color:var(--sea)}
a{color:var(--sea);text-underline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.primary:hover{border-color:var(--ink)}
.link{border:0;padding:0;background:none;color:var(--sea);text-decoration:underline;text-underline-offset:2px;font-weight:400}

/* notebook-style date picker (entry form) */
.dp-wrap{position:relative}
.vh-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.file-btn{display:inline-flex;align-items:center;gap:8px;justify-self:start;cursor:pointer;padding:8px 14px;border:1px solid var(--sea);border-radius:8px;color:var(--sea);font-size:14.5px;font-weight:600;background:transparent}
.file-btn:hover{background:var(--sea-soft)}
.vh-file:focus-visible+.file-btn{outline:2px solid var(--sea);outline-offset:2px}

.dpick{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-weight:400}

function sbStore(uid){

    if(!full){const{data,error}=await sb.from('entries').select('id,data,updated_at').limit(5000);if(error)throw error;
      rows.clear();data.forEach(r=>rows.set(r.id,{u:r.updated_at||'',d:r.data}));full=true}
    else{const{data,error}=await sb.from('entries').select('id,updated_at').limit(5000);if(error)throw error;
      const seen=new Set();const need=[];data.forEach(r=>{seen.add(r.id);const o=rows.get(r.id);if(!o||o.u!==(r.updated_at||''))need.push(r.id)});
      let gone=false;[...rows.keys()].forEach(id=>{if(!seen.has(id)){rows.delete(id);gone=true}});
      if(!need.length&&!gone)return;
      for(let i=0;i<need.length;i+=100){const{data:d2,error:e2}=await sb.from('entries').select('id,data,updated_at').in('id',need.slice(i,i+100));if(e2)throw e2;d2.forEach(r=>rows.set(r.id,{u:r.updated_at||'',d:r.data}))}}
    listener&&listener([...rows].map(([id,r])=>({...r.d,id})));
  })();try{return await busy}finally{busy=null;if(again){again=false;setTimeout(()=>load().catch(()=>{}),0)}}};
  addEventListener('focus',()=>{load().catch(()=>{})});

  return{
    sub(fn,fail){listener=fn;load().catch(fail)},
    newId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'')},

    async backup(id,d,del){const{error}=await sb.from('history').insert({user_id:uid,entry_id:id,saved_at:Date.now(),deleted:!!del,data:d});if(error)throw error},
    async history(){const{data,error}=await sb.from('history').select('entry_id,saved_at,deleted,data').order('saved_at',{ascending:false}).limit(1000);if(error)throw error;return data.map(h=>({entryId:h.entry_id,savedAt:+h.saved_at,deleted:h.deleted,data:h.data}))}
  };
}

/* Saving never drops anything: it merges into the latest copy and keeps the previous version first */
async function saveEntry(id,data){
  if(!store)return false;
  const nid=id||store.newId(),cur=id?entries.find(e=>e.id===id):null,base=cur?bodyOf(cur):{};
  const next={...base};
  Object.keys(data).forEach(k=>{const v=data[k];if(v===''||v==null||(Array.isArray(v)&&!v.length))delete next[k];else next[k]=v});
  try{
    if(cur&&JSON.stringify(base)!==JSON.stringify(next)){await store.backup(id,base)}
    await store.save(nid,next);freshId=nid;render(false);return nid;
  }catch(e){writeError(e);return false}
}

let sampler=null,fixPrev=null,fixPending=null;
function fixState(k,canUndo){

async function spellFix(text){
  const out=await sampler('Fix only spelling, accents and obvious typos in the note below. Keep its language or languages, wording, word order, numbers, names and line breaks. Do not translate, rephrase or add anything. Reply with only the corrected text.\n\n<note>\n'+text+'\n</note>',{modelTier:'quick',cache:false});
  const r=String(out&&out.text||'').replace(/<\/?note>/g,'').trim();
  if(!r||r.length>text.length*1.3+8||r.length<text.length*.7)return text;
  return r;
}
function runFix(){
  const el=$('eNotes'),text=el.value.trim();
  if(!sampler||!text){fixPending=null;return}
  fixState('fixing');
  const p=spellFix(text).then(r=>{
    if(el.value.trim()!==text)return;
    if(r===text){fixState('fixNone');return}
    fixPrev=el.value;el.value=r;fixState('fixed',true);
  }).catch(()=>{fixState('fixFail')}).finally(()=>{if(fixPending===p)fixPending=null});
  fixPending=p;
}

  let j;try{j=JSON.parse(await f.text())}catch(e){toast(t('errImport'));return}
  if(!j||!['spearfishers-notebook','spearo-diary'].includes(j.app)||!Array.isArray(j.entries)){toast(t('errImport'));return}
  const map={};
  if(j.files&&assets)for(const[old,url]of Object.entries(j.files)){try{const b=await(await fetch(url)).blob();map[old]=(await assets.upload(new File([b],'p',{type:b.type}))).id}catch(err){}}
  const remap=e=>({...e,photos:(e.photos||[]).map(p=>map[p]||p),shots:(e.shots||[]).map(x=>({...x,id:map[x.id]||x.id}))});
  let n=0;
  for(const e0 of j.entries){const e=remap(e0);
    if(!e||typeof e.id!=='string'||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(e.id))continue;
    const{id,...d}=e;
    if(entries.some(x=>x.id===id)){if(await saveEntry(id,d))n++}
    else{try{await store.save(id,d);n++}catch(err){writeError(err);break}}
  }
  toast(t('importedN')(n));
});

  const rows=sorted(entries.filter(matches)).map(e=>[e.date,typeLabel(kindOf(e)),e.spot||e.title,e.gps,(e.catches||[]).map(c=>catchLabel(c)+(latinOf(c.name,c.sub)?' ('+latinOf(c.name,c.sub)+')':'')).join('; '),catchCount(e)||'',catchKg(e)||'',e.depth,e.vis,e.temp,e.timeIn,e.timeOut,tidesOf(e)[0]?t('tide_'+tidesOf(e)[0]):'',tidesOf(e)[1]?t('tide_'+tidesOf(e)[1]):'',e.current?t('cur_'+e.current):'',dirLabel(e.currentDir),e.weather?t('w_'+e.weather):'',e.sea?t('sea_'+e.sea):'',e.mood?t('mood_'+e.mood):'',windTxt(e.wind),e.gear,(e.guns||[]).join('; '),e.tempDeep,e.thermo,e.lastro,e.neutral,apneaF(e.apnea),e.feel?t('fe_'+e.feel):'',e.equal?t('eq_'+e.equal):'',e.access?t('acc_'+e.access):'',e.tactic,[(e.errors||[]).map(k=>t('er_'+k)).join('; '),e.errNote].filter(Boolean).join('. '),e.lesson,(e.tags||[]).join('; '),e.notes].map(q).join(','));

const wikiCache=new Map();
async function wikiPhoto(lat){
  const q=lat.replace(/ spp\.$/,'').trim();if(wikiCache.has(q))return wikiCache.get(q);
  let out=null;
  for(const host of [lang==='pt'?'pt':'en','en']){
    try{const r=await fetch('https://'+host+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q.replace(/ /g,'_')));
      if(r.ok){const j=await r.json();const im=j.thumbnail||j.originalimage;if(im&&im.source){out={src:im.source,page:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||''};break}}}catch(e){}
  }
  if(out&&!out.by)out.by='Wikipedia';
  wikiCache.set(q,out);return out;
}

function openSpecies(name,sub){
  const lat=latinOf(name,sub),label=subLabel(name,sub)||fishLabel(name),f=fishRow(name),L=legalOf(name,sub);
  const other=f?(sub?(subsOf(name).find(x=>x.id===sub)||{})[lang==='pt'?'en':'pt']:f[lang==='pt'?0:1]):'';
  const q=encodeURIComponent((lat||label).replace(/ spp\.$/,''));
  const legal=[L.note?'<p class="sp-warn">'+esc(L.note)+'</p>':'',L.banned?'<p class="sp-ban">'+esc(t('spBanned'))+'</p>':'',
    L.min?'<p><b>'+esc(t('spMin'))+':</b> '+esc(L.min)+(L.min.endsWith('*')?' <span class="hint">'+esc(t('spMantle'))+'</span>':'')+'</p>':'<p class="hint">'+esc(t('spNoMin'))+'</p>',
    ...L.def.map(d=>'<p class="'+(d.now?'sp-ban':'')+'"><b>'+esc(t('spDefeso'))+':</b> '+esc(dm(d.from))+' – '+esc(dm(d.to))+' · '+esc(d.area[lang])+(d.now?' · '+esc(t('spNow')):'')+'</p>')].join('');
  $('spBody').innerHTML='<div class="sp-top">'+fishSvg(name,sub).replace('class="fi"','class="fi sp-fi"')+'<div><h2>'+esc(label)+'</h2>'+(lat?'<p class="lat">'+esc(lat)+'</p>':'')+(other?'<p class="hint">'+esc(other)+'</p>':'')+'</div></div>'
    +'<div class="sp-photo" id="spPhoto">'+(IS_SITE?'<span class="hint">'+esc(t('spLoading'))+'</span>':'')+'</div>'
    +'<div class="sp-legal">'+legal+'<p class="hint">'+esc(t('spLegalNote'))+'</p></div>'
    +'<p class="sp-links"><a href="https://'+(lang==='pt'?'pt':'en')+'.wikipedia.org/wiki/'+q.replace(/%20/g,'_')+'" target="_blank" rel="noopener">Wikipedia</a><a href="https://www.google.com/search?tbm=isch&q='+q+'" target="_blank" rel="noopener">'+esc(t('spImages'))+'</a>'+fbLink(decodeURIComponent(q))+'</p>';
  $('species').showModal();
  if(IS_SITE&&lat)spGallery('spPhoto',lat,label);
  else $('spPhoto').hidden=true;
}

const DOC_URL={min:'tamanhos-minimos-2026-02-26.pdf',def:'defesos-2025-02-27.pdf'};
const RULES={
pt:`<details open><summary>Licença</summary><h4 class="reg">Continente</h4><ul><li>Licença de pesca lúdica <b>submarina</b> (só caça submarina: 3 € diária, 10 € mensal, 25 € anual) ou <b>geral</b> (20 € mensal, 70 € anual). Vale só no continente.</li><li>Onde: portal <a href="https://www.bmar.pt" target="_blank" rel="noopener">BMar</a> (pagamento por transferência; pedir 5 dias úteis antes), Multibanco (só com cartão português), ou balcões da DGRM e das Direções Regionais.</li><li>Menores de 16 anos podem pescar sem licença própria se acompanhados por um titular de licença.</li></ul><h4 class="reg">Madeira</h4><ul><li>A licença do continente não é válida.</li><li>Licença mensal ou anual da Direção Regional de Pescas: portal <a href="https://simplifica.madeira.gov.pt" target="_blank" rel="noopener">Simplifica</a> (cultura e lazer › licença de pesca lúdica), Lota do Funchal ou DRP em Câmara de Lobos. A fatura-recibo vale como licença.</li><li>Menores precisam de declaração do encarregado de educação.</li></ul><h4 class="reg">Açores</h4><ul><li>A licença do continente não é válida.</li><li>Licença pessoal de pesca submarina da Direção Regional das Pescas (trienal, anual, mensal ou diária), na própria Direção ou nos balcões RIAC.</li></ul><h4 class="reg">Todas as regiões</h4><ul><li>Desde janeiro de 2026 é obrigatório registar certas capturas, incluindo o robalo, na app <button type="button" class="link rf-btn" aria-expanded="false">RecFishing</button><span class="rf-links" hidden> (descarregar a app: <a href="https://apps.apple.com/pt/app/recfishing/id6746253374" target="_blank" rel="noopener">App Store (iPhone)</a> · <a href="https://play.google.com/store/apps/details?id=eu.europa.publications.recfishing" target="_blank" rel="noopener">Google Play (Android)</a>)</span> da Comissão Europeia.</li></ul><details class="src"><summary>Fonte</summary><p class="hint">Cada região tem regras próprias: Portugal continental, Madeira e Açores. Não substitui a lei: confirme na DGRM, na Direção Regional ou na Capitania antes de pescar.</p></details></details>
<details><summary>Como pescar</summary><h4 class="reg">Continente</h4><ul><li>Só em <b>apneia</b>: proibido qualquer equipamento auxiliar de respiração.</li><li>Proibido entre o pôr do sol e o nascer do sol.</li><li>Obrigatório sinalizar à superfície: bóia vermelha, laranja ou amarela de pelo menos 8 litros com bandeira Alfa (ou prancha de 70×40×5 cm com mastro de 40 cm), a no máximo <b>30 m</b> do caçador.</li><li>Equipamento permitido: espingarda submarina, faca de mariscar, bicheiro ou puxeiro, arrelhada. Sem iscos nem engodos. Lanterna só por segurança, nunca para atrair peixe.</li><li>Proibido transportar a espingarda carregada fora de água ou em zonas proibidas, e ter espingarda e garrafas de mergulho na mesma embarcação.</li></ul><h4 class="reg">Madeira e Açores</h4><ul><li>Também só em apneia. Regras de sinalização, horários e equipamento: ver a legislação regional nas ligações abaixo.</li></ul></details>
<details><summary>Distâncias e zonas proibidas</summary><h4 class="reg">Continente</h4><ul><li>20 m entre caçadores (salvo acordo). As embarcações devem manter 50 m da bóia e das artes de pesca.</li><li>Proibido em canais de navegação e barras de portos e rios, a menos de 100 m de portos, estaleiros, aquaculturas e emissários sinalizados, e nas zonas balneares concessionadas.</li><li>Proibida em todo o Parque Natural da Arrábida, na Reserva Natural das Berlengas e nas zonas de proteção parcial tipo II do Parque Natural do Sudoeste Alentejano e Costa Vicentina.</li></ul><h4 class="reg">Madeira e Açores</h4><ul><li>Cada região tem as suas reservas e áreas marinhas protegidas. Confirme antes de pescar.</li></ul></details>
<details><summary>Limites de captura</summary><h4 class="reg">Continente</h4><ul><li><b>15 kg por pescador por dia</b>, sem contar o maior exemplar. Com embarcação de apoio, o limite conta por pescador.</li><li>Organismos que não sejam peixes nem cefalópodes: até 2 kg por dia, dentro dos 15 kg.</li><li>Exemplares abaixo do tamanho mínimo devolvem-se de imediato ao mar, mesmo mortos. Atingido o limite, a pesca termina.</li></ul><h4 class="reg">Madeira</h4><ul><li><b>10 exemplares por dia</b> (peixes, polvo e choco), no máximo 5 da mesma espécie.</li><li>Lagostas, cavacos e santolas: 2 por espécie e por dia.</li><li>Portaria 484/2016, alterada pela Portaria 384/2019.</li></ul><h4 class="reg">Açores</h4><ul><li><b>10 exemplares por dia</b> de peixes e polvos.</li><li>Crustáceos: 2 por dia.</li><li>Atingido o limite, a pesca termina. Decreto Legislativo Regional 9/2007/A.</li></ul></details>
<details><summary>Espécies proibidas</summary><h4 class="reg">Continente</h4><ul><li>Meros (todo o género <i>Epinephelus</i>), lagostas (<i>Palinurus</i>), lavagante (<i>Homarus gammarus</i>), ostra plana.</li><li>Atum-rabilho (<i>Thunnus thynnus</i>), peixe-lua, enguia, salmão, sável, savelha, lampreia.</li><li>Raia curva e raia tairoga; tubarões albafar, branco, frade, luzidio, pontas-brancas, sardo e zorro; galhudo malhado.</li><li>Cavalos-marinhos e marinhas, corais, mamíferos, tartarugas e aves marinhas.</li></ul><h4 class="reg">Madeira</h4><ul><li>Mero, badejo, peixe-cão e enguia, entre outros.</li><li>Atum-rabilho só com autorização anual da DRP.</li><li>Lagostas, cavacos e santolas são permitidos (2 por espécie e por dia).</li></ul><h4 class="reg">Açores</h4><ul><li>Mero e lapas, entre outros.</li></ul></details>
<p class="hint">Ligações</p><p class="sp-links"><a href="https://dgrm.pt/documents/20143/121104/FAQ-Pesca+Ludica+2026.pdf/586f6137-df78-25e7-e7ad-8a3dcc1f9ffc" target="_blank" rel="noopener">FAQ DGRM 2026 (continente)</a><a href="https://www.dgrm.pt/licenca-de-pesca-ludica" target="_blank" rel="noopener">Licença (DGRM)</a><a href="https://joram.madeira.gov.pt/joram/1serie/Ano%20de%202016/ISerie-199-2016-11-14sup.pdf" target="_blank" rel="noopener">Portaria 484/2016 (Madeira)</a><a href="https://www.madeira.gov.pt//Portals/40/documentos/Altera%C3%A7%C3%A3o%20%C3%A0%20Poratria%20484-2016.pdf" target="_blank" rel="noopener">Portaria 384/2019 (Madeira)</a><a href="https://www.marinha.pt/pt/clm/ficheiros/CLM/PGPAT%201000%20-%20Cap%C3%ADtulos/Cap%C3%ADtulo%20C%20Recreio/Sub-cap%C3%ADtulo%20C.2%20-%20Pesca%20l%C3%BAdica/Decreto%20Legislativo%20Regional%209-2007-A%20de%2019%20ABR.pdf" target="_blank" rel="noopener">DLR 9/2007/A (Açores)</a></p>`,
en:`<details open><summary>Licence</summary><h4 class="reg">Mainland</h4><ul><li>Recreational fishing licence: <b>spearfishing</b> (spearfishing only: €3 a day, €10 a month, €25 a year) or <b>general</b> (€20 a month, €70 a year). Valid on the mainland only.</li><li>Where: the <a href="https://www.bmar.pt" target="_blank" rel="noopener">BMar</a> portal (pay by bank transfer; apply 5 working days ahead), Multibanco (Portuguese cards only), or DGRM and regional offices.</li><li>Under-16s may fish without their own licence when accompanied by a licence holder.</li></ul><h4 class="reg">Madeira</h4><ul><li>The mainland licence is not valid.</li><li>Monthly or annual licence from the regional fisheries directorate (DRP): the <a href="https://simplifica.madeira.gov.pt" target="_blank" rel="noopener">Simplifica</a> portal (culture and leisure › recreational fishing licence), the Funchal fish market or the DRP in Câmara de Lobos. The receipt is the licence.</li><li>Minors need a guardian's written consent.</li></ul><h4 class="reg">Azores</h4><ul><li>The mainland licence is not valid.</li><li>Personal spearfishing licence from the regional fisheries directorate (3-year, annual, monthly or daily), at its offices or at RIAC counters.</li></ul><h4 class="reg">All regions</h4><ul><li>Since January 2026 some catches, including sea bass, must be logged in the European Commission's <button type="button" class="link rf-btn" aria-expanded="false">RecFishing</button><span class="rf-links" hidden> (get the app: <a href="https://apps.apple.com/pt/app/recfishing/id6746253374" target="_blank" rel="noopener">App Store (iPhone)</a> · <a href="https://play.google.com/store/apps/details?id=eu.europa.publications.recfishing" target="_blank" rel="noopener">Google Play (Android)</a>)</span> app.</li></ul><details class="src"><summary>Source</summary><p class="hint">Each region has its own rules: mainland Portugal, Madeira and the Azores. It does not replace the law: check with DGRM, the regional directorate or the local Capitania before you fish.</p></details></details>
<details><summary>How to fish</summary><h4 class="reg">Mainland</h4><ul><li><b>Breath-hold only</b>: no breathing apparatus of any kind.</li><li>Forbidden between sunset and sunrise.</li><li>Surface marker required: a red, orange or yellow buoy of at least 8 litres with an Alpha flag (or a 70×40×5 cm board with a 40 cm mast), no more than <b>30 m</b> from the diver.</li><li>Allowed gear: speargun, knife, gaff, fish stringer. No bait or chum. A torch only for safety, never to attract fish.</li><li>Do not carry a loaded speargun out of the water or in closed areas, and do not carry a speargun and scuba tanks on the same boat.</li></ul><h4 class="reg">Madeira and the Azores</h4><ul><li>Breath-hold only here too. For marker, hours and gear rules, see the regional law in the links below.</li></ul></details>
<details><summary>Distances and closed areas</summary><h4 class="reg">Mainland</h4><ul><li>20 m between divers (unless agreed). Boats must keep 50 m from the buoy and from fishing gear.</li><li>Forbidden in port and river-mouth channels, within 100 m of ports, shipyards, fish farms and marked outfalls, and in supervised bathing areas.</li><li>Forbidden in the whole Arrábida Natural Park, the Berlengas Nature Reserve and the type II partial-protection zones of the Southwest Alentejo and Vicentine Coast Natural Park.</li></ul><h4 class="reg">Madeira and the Azores</h4><ul><li>Each region has its own reserves and marine protected areas. Check before you fish.</li></ul></details>
<details><summary>Catch limits</summary><h4 class="reg">Mainland</h4><ul><li><b>15 kg per diver per day</b>, not counting the largest fish. With a support boat the limit is per diver.</li><li>Organisms other than fish and cephalopods: up to 2 kg a day, within the 15 kg.</li><li>Undersized fish go back immediately, even if dead. Once you reach the limit, stop fishing.</li></ul><h4 class="reg">Madeira</h4><ul><li><b>10 fish a day</b> (fish, octopus and cuttlefish), no more than 5 of one species.</li><li>Spiny lobsters, slipper lobsters and spider crabs: 2 of each per day.</li><li>Portaria 484/2016, amended by Portaria 384/2019.</li></ul><h4 class="reg">Azores</h4><ul><li><b>10 fish and octopus a day</b>.</li><li>Crustaceans: 2 a day.</li><li>Once you reach the limit, stop fishing. Regional Legislative Decree 9/2007/A.</li></ul></details>
<details><summary>Protected species</summary><h4 class="reg">Mainland</h4><ul><li>Groupers (all <i>Epinephelus</i>), spiny lobsters (<i>Palinurus</i>), European lobster (<i>Homarus gammarus</i>), flat oyster.</li><li>Bluefin tuna (<i>Thunnus thynnus</i>), sunfish, eel, salmon, allis and twaite shad, lamprey.</li><li>Undulate ray and white skate; bluntnose sixgill, white, basking, silky, oceanic whitetip, porbeagle and bigeye thresher sharks; spurdog.</li><li>Seahorses and pipefish, corals, marine mammals, sea turtles and seabirds.</li></ul><h4 class="reg">Madeira</h4><ul><li>Dusky grouper, island grouper (badejo), peixe-cão and eel, among others.</li><li>Bluefin tuna only with a yearly permit from the DRP.</li><li>Spiny lobsters, slipper lobsters and spider crabs are allowed (2 of each per day).</li></ul><h4 class="reg">Azores</h4><ul><li>Dusky grouper and limpets, among others.</li></ul></details>
<p class="hint">Links</p><p class="sp-links"><a href="https://dgrm.pt/documents/20143/121104/FAQ-Pesca+Ludica+2026.pdf/586f6137-df78-25e7-e7ad-8a3dcc1f9ffc" target="_blank" rel="noopener">DGRM FAQ 2026 (mainland)</a><a href="https://www.dgrm.pt/licenca-de-pesca-ludica" target="_blank" rel="noopener">Licence (DGRM)</a><a href="https://joram.madeira.gov.pt/joram/1serie/Ano%20de%202016/ISerie-199-2016-11-14sup.pdf" target="_blank" rel="noopener">Portaria 484/2016 (Madeira)</a><a href="https://www.madeira.gov.pt//Portals/40/documentos/Altera%C3%A7%C3%A3o%20%C3%A0%20Poratria%20484-2016.pdf" target="_blank" rel="noopener">Portaria 384/2019 (Madeira)</a><a href="https://www.marinha.pt/pt/clm/ficheiros/CLM/PGPAT%201000%20-%20Cap%C3%ADtulos/Cap%C3%ADtulo%20C%20Recreio/Sub-cap%C3%ADtulo%20C.2%20-%20Pesca%20l%C3%BAdica/Decreto%20Legislativo%20Regional%209-2007-A%20de%2019%20ABR.pdf" target="_blank" rel="noopener">DLR 9/2007/A (Azores)</a></p>`};
const SIZES={
pt:`<p class="hint">Tabelas para Portugal continental: tamanhos mínimos da DGRM de 26-02-2026 e defesos da DGRM de 2026. A Madeira e os Açores têm tabelas próprias: confirme na Direção Regional.</p>
<details open><summary>Tamanhos mínimos</summary><div class="tbl"><table>
<tr><td>Badejo (<i>Merlangius</i>), pescada</td><td>27 cm</td></tr><tr><td>Besugo</td><td>18 cm</td></tr><tr><td>Bica, boga, carapau, ferreira</td><td>15 cm</td></tr><tr><td>Choco, lula (comprimento do manto)</td><td>10 cm</td></tr><tr><td>Choupa</td><td>23 cm</td></tr><tr><td>Corvina</td><td>42 cm</td></tr><tr><td>Dourada</td><td>19 cm</td></tr><tr><td>Faneca</td><td>17 cm</td></tr><tr><td>Goraz</td><td>33 cm</td></tr><tr><td>Juliana</td><td>42 cm</td></tr><tr><td>Linguado</td><td>24 cm</td></tr><tr><td>Maruca</td><td>63 cm</td></tr><tr><td>Mucharra-alcorraz / mucharra-branca</td><td>14 / 12 cm</td></tr><tr><td>Navalheira, ouriço-do-mar</td><td>5 cm</td></tr><tr><td>Pargo-legítimo</td><td>20 cm</td></tr><tr><td>Polvo</td><td>750 g</td></tr><tr><td>Pregado, rodovalho</td><td>30 cm</td></tr><tr><td>Robalo</td><td>36 cm</td></tr><tr><td>Safio / congro</td><td>58 cm</td></tr><tr><td>Salema, salmonete</td><td>18 cm</td></tr><tr><td>Santola / sapateira</td><td>12 / 13 cm</td></tr><tr><td>Sargo-bicudo</td><td>22 cm</td></tr><tr><td>Sargo-legítimo, safia</td><td>17 cm</td></tr><tr><td>Sargo-veado</td><td>27 cm</td></tr><tr><td>Tainhas, cavala, sarda</td><td>20 cm</td></tr></table></div>
<p class="hint">Sem tamanho mínimo: dentão/capatão, bodião, liche, charuteiro, anchova, moreia, abrótea, rascasso, peixe-galo, peixe-porco, serrano, cherne e outros.</p></details>
<details open><summary>Defeso (períodos de proibição)</summary>
<h4 class="reg">Para a caça submarina</h4><div class="tbl"><table>
<tr><td>Bodião (<i>Labrus bergylta</i>)</td><td>1 de março – 31 de maio, PNSACV</td></tr>
<tr><td>Corvina</td><td>1–30 de junho, todo o continente</td></tr>
<tr><td>Lagosta e lavagante com ovos</td><td>Todo o ano: devolver de imediato ao mar (e proibidos na caça submarina)</td></tr>
<tr><td>Raia curva</td><td>Maio – julho (e proibida na caça submarina todo o ano)</td></tr>
<tr><td>Sargo-legítimo e sargo-safia</td><td>Fevereiro, Parque Natural do Sudoeste Alentejano e Costa Vicentina (PNSACV)</td></tr></table></div>
<h4 class="reg">Apanha (à mão)</h4><div class="tbl"><table>
<tr><td>Búzio</td><td>Maio – junho</td></tr>
<tr><td>Percebe e ouriço</td><td>Em 2026 os períodos foram alterados pelo <a href="https://www.dgrm.pt/destaques?articleId=887321" target="_blank" rel="noopener">Despacho 22/DG/2026</a>, com datas diferentes para o continente, PNSACV, Sines, Berlengas e norte e sul do Tejo. Confirme as datas na tabela.</td></tr>
<tr><td>Plantas marinhas (agarófitas)</td><td>1 jan – 15 jul e 15 nov – 31 dez</td></tr>
<tr><td>Santola e navalheira</td><td>15 de fevereiro – 15 de junho</td></tr></table></div>

<p class="hint">Segundo a <a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">tabela de defesos da DGRM de 2026</a>. Aqui só as linhas que tocam a caça submarina e a apanha à mão.</p></details>
<p class="sp-links"><a href="https://dgrm.pt/documents/20143/121104/FAQ-Pesca+Ludica+2026.pdf/586f6137-df78-25e7-e7ad-8a3dcc1f9ffc" target="_blank" rel="noopener">FAQ DGRM 2026</a><a href="https://www.dgrm.pt/licenca-de-pesca-ludica" target="_blank" rel="noopener">Licença (DGRM)</a><a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">Defesos 2026 (DGRM)</a></p><p class="sp-links"><a href="${DOC_URL.min}" target="_blank" rel="noopener">Tamanhos mínimos (DGRM, 26-02-2026)</a><a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">Defesos (DGRM, 2026)</a><a href="https://www.ipma.pt/export/sites/ipma/bin/docs/publicacoes/pescas.mar/Manual_Peixes_Osseos_V4.pdf" target="_blank" rel="noopener">Manual de identificação de peixes ósseos (IPMA)</a></p>`,
en:`<p class="hint">Tables for mainland Portugal: DGRM minimum sizes of 26 Feb 2026 and DGRM closed seasons for 2026. Madeira and the Azores have their own tables: check with the regional directorate.</p>
<details open><summary>Minimum sizes</summary><div class="tbl"><table>
<tr><td>Annular / Senegal seabream</td><td>14 / 12 cm</td></tr><tr><td>Axillary seabream</td><td>18 cm</td></tr><tr><td>Black seabream</td><td>23 cm</td></tr><tr><td>Blackspot seabream</td><td>33 cm</td></tr><tr><td>Conger</td><td>58 cm</td></tr><tr><td>Cuttlefish, squid (mantle length)</td><td>10 cm</td></tr><tr><td>Gilthead bream</td><td>19 cm</td></tr><tr><td>Grey mullets, mackerels</td><td>20 cm</td></tr><tr><td>Ling</td><td>63 cm</td></tr><tr><td>Meagre</td><td>42 cm</td></tr><tr><td>Octopus</td><td>750 g</td></tr><tr><td>Pandora, bogue, horse mackerel, sand steenbras</td><td>15 cm</td></tr><tr><td>Pollack</td><td>42 cm</td></tr><tr><td>Pouting</td><td>17 cm</td></tr><tr><td>Red porgy</td><td>20 cm</td></tr><tr><td>Salema, red mullet</td><td>18 cm</td></tr><tr><td>Sea bass</td><td>36 cm</td></tr><tr><td>Sharpsnout seabream</td><td>22 cm</td></tr><tr><td>Sole</td><td>24 cm</td></tr><tr><td>Spider crab / brown crab</td><td>12 / 13 cm</td></tr><tr><td>Turbot, brill</td><td>30 cm</td></tr><tr><td>Velvet crab, sea urchin</td><td>5 cm</td></tr><tr><td>White and two-banded seabream</td><td>17 cm</td></tr><tr><td>Whiting, hake</td><td>27 cm</td></tr><tr><td>Zebra seabream</td><td>27 cm</td></tr></table></div>
<p class="hint">No minimum size: dentex, wrasse, leerfish, amberjack, bluefish, moray, forkbeard, scorpionfish, John Dory, triggerfish, comber, wreckfish and others.</p></details>
<details open><summary>Closed seasons</summary>
<h4 class="reg">For spearfishing</h4><div class="tbl"><table>
<tr><td>Ballan wrasse (<i>Labrus bergylta</i>)</td><td>1 March – 31 May, PNSACV</td></tr>
<tr><td>Egg-bearing lobsters</td><td>All year: release at once (and banned for spearfishing)</td></tr>
<tr><td>Meagre</td><td>1–30 June, all of mainland Portugal</td></tr>
<tr><td>Undulate ray</td><td>May – July (and banned for spearfishing all year)</td></tr>
<tr><td>White and two-banded seabream</td><td>February, Southwest Alentejo and Vicentine Coast Natural Park (PNSACV)</td></tr></table></div>
<h4 class="reg">Hand gathering</h4><div class="tbl"><table>
<tr><td>Goose barnacles and sea urchins</td><td>For 2026 the periods were changed by <a href="https://www.dgrm.pt/destaques?articleId=887321" target="_blank" rel="noopener">Despacho 22/DG/2026</a>, with different dates for the mainland, PNSACV, Sines, the Berlengas and north and south of the Tagus. Check the dates in the table.</td></tr>
<tr><td>Murex whelks</td><td>May – June</td></tr>
<tr><td>Seaweed (agarophytes)</td><td>1 Jan – 15 Jul and 15 Nov – 31 Dec</td></tr>
<tr><td>Spider crab and velvet crab</td><td>15 February – 15 June</td></tr></table></div>

<p class="hint">From the <a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">DGRM 2026 closed-season table</a>. Only the lines that concern spearfishing and hand gathering.</p></details>
<p class="sp-links"><a href="https://dgrm.pt/documents/20143/121104/FAQ-Pesca+Ludica+2026.pdf/586f6137-df78-25e7-e7ad-8a3dcc1f9ffc" target="_blank" rel="noopener">DGRM FAQ 2026</a><a href="https://www.dgrm.pt/licenca-de-pesca-ludica" target="_blank" rel="noopener">Licence (DGRM)</a><a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">Closed seasons 2026 (DGRM)</a></p><p class="sp-links"><a href="${DOC_URL.min}" target="_blank" rel="noopener">Minimum sizes (DGRM, 26 Feb 2026)</a><a href="https://www.dgrm.pt/documents/20143/121101/TABELA_DEFESOS_DGRM_2026-03-25.pdf/cbe6baee-ae7a-6040-497c-42d73068f262" target="_blank" rel="noopener">Closed seasons (DGRM, 2026)</a><a href="https://www.ipma.pt/export/sites/ipma/bin/docs/publicacoes/pescas.mar/Manual_Peixes_Osseos_V4.pdf" target="_blank" rel="noopener">Bony fish identification manual (IPMA)</a></p>`};
$('rulesBtn').addEventListener('click',()=>{$('rulesBody').innerHTML=RULES[lang];$('rules').showModal()});
$('rulesBody').addEventListener('click',ev=>{const b=ev.target.closest('.rf-btn');if(!b)return;const l=b.nextElementSibling;l.hidden=!l.hidden;b.setAttribute('aria-expanded',String(!l.hidden))});
$('rulesClose').addEventListener('click',()=>$('rules').close());
$('sizesBtn').addEventListener('click',()=>{$('sizesBody').innerHTML=SIZES[lang];$('sizes').showModal()});
$('sizesClose').addEventListener('click',()=>$('sizes').close());
$('rules').addEventListener('click',ev=>{if(ev.target===$('rules'))$('rules').close()});
/* ===== Gear checklists: named lists (templates); items can hold sub-items (kids) at any depth ===== */
let checkDoc=null;
const CK_BASE={pt:['Licença de pesca','Documento de identificação',['Bóia',['Bandeira Alfa','Enrolador com cabo e poita']],'Arma','Casaco','Calças','Gorro','Luvas','Meias','Barbatanas','Máscara','Tubo','Cinto de lastro','Enfião de peixe','Aquashoes','Faca','Lanterna','Bicheiro','Relógio','Slippy','Água','Comida','Poncho'],en:['Fishing licence','ID document',['Buoy',['Alpha flag','Reel with line and anchor']],'Speargun','Wetsuit jacket','Wetsuit trousers','Hood','Gloves','Socks','Fins','Mask','Snorkel','Weight belt','Fish stringer','Aquashoes','Knife','Torch','Gaff','Watch','Slippy','Water','Food','Poncho']};
const ckId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ckFromBase=a=>a.map(x=>Array.isArray(x)?{id:ckId(),text:x[0],done:false,kids:ckFromBase(x[1])}:{id:ckId(),text:x,done:false});
function ckLists(){
  const d=checkDoc||{};
  if(Array.isArray(d.lists)&&d.lists.length)return d.lists.map(l=>l.id==='l1'&&/^(Caça submarina|Spearfishing)$/.test(l.name||'')?{...l,name:t('ckDefName')}:l);
  return[{id:'l1',name:t('ckDefName'),items:d.items||[]}];
}
function ckCur(){const ls=ckLists();return ls.find(l=>l.id===(checkDoc&&checkDoc.cur))||ls[0]}
const ckItems=()=>ckCur().items||[];
const ckClone=a=>JSON.parse(JSON.stringify(a||[]));
function ckWalk(a,fn,depth=0,parent=null){for(const x of a){fn(x,depth,parent);if(x.kids&&x.kids.length)ckWalk(x.kids,fn,depth+1,x)}}
function ckFind(a,id,parent=null){for(let i=0;i<a.length;i++){if(a[i].id===id)return{arr:a,i,item:a[i],parent};if(a[i].kids){const r=ckFind(a[i].kids,id,a[i]);if(r)return r}}return null}
function ckSetAll(x,v){x.done=v;(x.kids||[]).forEach(k=>ckSetAll(k,v))}
function ckFixParents(a){a.forEach(x=>{if(x.kids&&x.kids.length)ckFixParents(x.kids);else if(x.kids)delete x.kids})}
async function ckSaveDoc(lists,cur){
  if(!store)return;
  const c=lists.find(l=>l.id===cur)||lists[0];
  const d={type:'checklist',lists,cur:c.id,items:c.items,createdAt:(checkDoc&&checkDoc.createdAt)||Date.now()};
  checkDoc={...d,id:'checklist'};ckDraw();
  try{await store.save('checklist',d)}catch(e){writeError(e)}
}
function ckSave(items){ckFixParents(items);const ls=ckLists(),c=ckCur();ckSaveDoc(ls.map(l=>l.id===c.id?{...l,items}:l),c.id)}
let ckEditing=null,ckDelArm=false,ckAddTo=null;const ckOpen=new Set();
function ckRow(x,d){
  const kids=x.kids&&x.kids.length,open=ckOpen.has(x.id),kd=kids?x.kids.filter(k=>k.done).length:0;
  return '<li class="'+(x.done?'on':'')+'" data-id="'+esc(x.id)+'" style="--d:'+d+'"><button type="button" class="ck-h" aria-label="'+esc(t('ckMove'))+'" title="'+esc(t('ckMove'))+'"><svg viewBox="0 0 12 18" width="12" height="18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg></button>'
   +(kids?'<button type="button" class="ck-tg" data-cktg="'+esc(x.id)+'" aria-expanded="'+open+'" aria-label="'+esc(t(open?'ckFold':'ckUnfold'))+'"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3 1.5L7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':'<span class="ck-tg ck-tg0"></span>')
   +'<input type="checkbox" data-ck="'+esc(x.id)+'"'+(x.done?' checked':'')+' aria-label="'+esc(x.text)+'">'
   +(ckEditing===x.id?'<input class="ck-edit" data-ckedit="'+esc(x.id)+'" value="'+esc(x.text)+'">':'<button type="button" class="ck-t" data-cktext="'+esc(x.id)+'" title="'+esc(x.text)+'">'+esc(x.text)+(kids?' <span class="ck-n">'+kd+'/'+x.kids.length+'</span>':'')+'</button>')
   +'<button type="button" class="link ck-sub" data-cksub="'+esc(x.id)+'" aria-label="'+esc(t('ckAddSub'))+'" title="'+esc(t('ckAddSub'))+'">+</button>'
   +'<button type="button" class="link ck-x" data-ckdel="'+esc(x.id)+'" aria-label="'+esc(t('del'))+'">×</button></li>'
   +((kids&&open)||ckAddTo===x.id?(kids&&open?x.kids.map(k=>ckRowTree(k,d+1)).join(''):'')+(ckAddTo===x.id?'<li class="ck-addrow" style="--d:'+(d+1)+'"><input class="ck-subin" data-ckparent="'+esc(x.id)+'" placeholder="'+esc(t('ckSubPh'))+'"></li>':''):'');
}
const ckRowTree=(x,d)=>ckRow(x,d);
function ckDraw(){
  const ls=ckLists(),c=ckCur(),it=c.items||[];let n=0,done=0;ckWalk(it,x=>{n++;if(x.done)done++});
  $('ckCount').textContent=n?done+' / '+n:'';
  $('ckSel').innerHTML=ls.map(l=>'<option value="'+esc(l.id)+'"'+(l.id===c.id?' selected':'')+'>'+esc(l.name||t('ckDefName'))+'</option>').join('');
  if(document.activeElement!==$('ckName'))$('ckName').value=c.name||'';
  $('ckDelList').hidden=ls.length<2;$('ckDelList').setAttribute('aria-label',t('ckDelL'));$('ckDelList').classList.add('ck-ib');if(ckDelArm){$('ckDelList').innerHTML='<span class="ck-q" aria-hidden="true">?</span>';$('ckDelList').setAttribute('aria-label',t('ckDelSure'))}else $('ckDelList').innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.500 7l1 12.500a2 2 0 0 0 2 1.500h7a2 2 0 0 0 2-1.500l1-12.500M9 7V4.500h6V7"/></svg>';
  $('ckList').innerHTML=it.length?it.map(x=>ckRow(x,0)).join(''):'<li class="hint">'+esc(t('ckEmpty'))+'</li>';
  $('ckBase').hidden=!!it.length;$('ckReset').hidden=!it.length;$('ckReset').disabled=!done;
  const ed=$('ckList').querySelector('.ck-edit');if(ed){ed.focus();ed.select()}
  const si=$('ckList').querySelector('.ck-subin');if(si&&!ed)si.focus();
}
function ckRename(id,v){ckEditing=null;v=v.trim();if(!v){ckDraw();return}const a=ckClone(ckItems()),f=ckFind(a,id);if(f)f.item.text=v;ckSave(a)}
$('ckBtn').addEventListener('click',()=>{ckEditing=null;ckDelArm=false;ckAddTo=null;ckDraw();$('checklist').showModal()});
$('ckClose').addEventListener('click',()=>$('checklist').close());
$('checklist').addEventListener('click',ev=>{if(ev.target===$('checklist'))$('checklist').close()});
$('ckList').addEventListener('change',ev=>{const id=ev.target.dataset.ck;if(!id)return;const a=ckClone(ckItems()),f=ckFind(a,id);if(f)f.item.done=ev.target.checked;ckSave(a)});
$('ckList').addEventListener('click',ev=>{
  const d=ev.target.closest('[data-ckdel]');if(d){const a=ckClone(ckItems()),f=ckFind(a,d.dataset.ckdel);if(f)f.arr.splice(f.i,1);ckSave(a);return}
  const g=ev.target.closest('[data-cktg]');if(g){const id=g.dataset.cktg;ckOpen.has(id)?ckOpen.delete(id):ckOpen.add(id);ckDraw();const b=$('ckList').querySelector('[data-cktg="'+CSS.escape(id)+'"]');if(b)b.focus();return}
  const s=ev.target.closest('[data-cksub]');if(s){ckAddTo=ckAddTo===s.dataset.cksub?null:s.dataset.cksub;if(ckAddTo)ckOpen.add(ckAddTo);ckEditing=null;ckDraw();return}
  const tx=ev.target.closest('[data-cktext]');if(tx){ckEditing=tx.dataset.cktext;ckAddTo=null;ckDraw()}
});
function ckIndent(id,dir){
  const a=ckClone(ckItems()),f=ckFind(a,id);if(!f)return;
  if(dir>0){if(f.i===0)return;const prev=f.arr[f.i-1];const[m]=f.arr.splice(f.i,1);(prev.kids=prev.kids||[]).push(m);ckOpen.add(prev.id)}
  else{if(!f.parent)return;const pf=ckFind(a,f.parent.id);const[m]=f.arr.splice(f.i,1);pf.arr.splice(pf.i+1,0,m)}
  ckSave(a);setTimeout(()=>{const b=$('ckList').querySelector('li[data-id="'+CSS.escape(id)+'"] .ck-h');if(b)b.focus()},0);
}
$('ckList').addEventListener('keydown',ev=>{
  const si=ev.target.closest('.ck-subin');
  if(si){if(ev.key==='Enter'){ev.preventDefault();const v=si.value.trim();if(!v){ckAddTo=null;ckDraw();return}const a=ckClone(ckItems()),f=ckFind(a,si.dataset.ckparent);si.value='';if(f)(f.item.kids=f.item.kids||[]).push({id:ckId(),text:v,done:false});ckSave(a)}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();ckAddTo=null;ckDraw()}return}
  const ed=ev.target.closest('.ck-edit');
  if(ed){if(ev.key==='Enter'){ev.preventDefault();ckRename(ed.dataset.ckedit,ed.value)}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();ckEditing=null;ckDraw()}return}
  const h=ev.target.closest('.ck-h');if(!h)return;const id=h.parentNode.dataset.id;
  if(ev.key==='ArrowRight'){ev.preventDefault();ckIndent(id,1);return}
  if(ev.key==='ArrowLeft'){ev.preventDefault();ckIndent(id,-1);return}
  if(ev.key!=='ArrowUp'&&ev.key!=='ArrowDown')return;ev.preventDefault();
  const a=ckClone(ckItems()),f=ckFind(a,id),j=f.i+(ev.key==='ArrowUp'?-1:1);if(j<0||j>=f.arr.length)return;
  const[m]=f.arr.splice(f.i,1);f.arr.splice(j,0,m);ckSave(a);setTimeout(()=>{const b=$('ckList').querySelector('li[data-id="'+CSS.escape(id)+'"] .ck-h');if(b)b.focus()},0);
});
$('ckList').addEventListener('focusout',ev=>{
  const ed=ev.target.closest&&ev.target.closest('.ck-edit');if(ed&&ckEditing===ed.dataset.ckedit){ckRename(ed.dataset.ckedit,ed.value);return}
  const si=ev.target.closest&&ev.target.closest('.ck-subin');if(si&&si.value.trim()&&si.isConnected){const v=si.value.trim();si.value='';const a=ckClone(ckItems()),f=ckFind(a,si.dataset.ckparent);if(f)(f.item.kids=f.item.kids||[]).push({id:ckId(),text:v,done:false});if(!$('ckList').contains(ev.relatedTarget))ckAddTo=null;ckSave(a);return}
  if(si&&!si.value.trim()&&ckAddTo===si.dataset.ckparent)setTimeout(()=>{if(ckAddTo===si.dataset.ckparent&&!$('ckList').contains(document.activeElement)){ckAddTo=null;ckDraw()}},150);
});
/* drag: drop in the middle of an item to put it inside; near the top or bottom edge to put it before or after */
$('ckList').addEventListener('pointerdown',ev=>{
  const h=ev.target.closest('.ck-h');if(!h)return;ev.preventDefault();
  const li=h.parentNode,ul=$('ckList'),pid=ev.pointerId,id=li.dataset.id;li.classList.add('drag');
  const src=ckFind(ckItems(),id);const banned=new Set();ckWalk([src.item],x=>banned.add(x.id));
  let tgt=null;
  const clear=()=>ul.querySelectorAll('.drop-b,.drop-a,.drop-in').forEach(x=>x.classList.remove('drop-b','drop-a','drop-in'));
  const move=e=>{if(e.pointerId!==pid)return;e.preventDefault();
    const sc=ul.closest('.sheet-in'),r=sc.getBoundingClientRect();if(e.clientY<r.top+40)sc.scrollTop-=8;else if(e.clientY>r.bottom-40)sc.scrollTop+=8;
    const rows=[...ul.querySelectorAll('li[data-id]')].filter(x=>!banned.has(x.dataset.id));
    let row=rows.find(x=>{const b=x.getBoundingClientRect();return e.clientY>=b.top&&e.clientY<b.bottom});
    if(!row&&rows.length){const last=rows[rows.length-1],first=rows[0];row=e.clientY<first.getBoundingClientRect().top?first:last}
    clear();tgt=null;if(!row)return;

const LIB_M=[["Acantholabrus palloni","Bodião-do-alto","","Labridae","Perciformes","Scale-rayed wrasse","Tordo de fondo","Roucaou / Acantholabre","AKL","LC",170,"Corpo alongado, moderadamente comprimido; coloração acastanhada mais ou menos esverdeada com zonas mais claras, por vezes avermelhada, ventre claro; mancha castanha escura sobre o pedúnculo caudal, por cima da linha lateral e por vezes outra mancha entre as partes espinhosa e mole da barbatana dorsal."],["Alosa alosa","Sável","","Clupeidae","Clupeiformes","Allis shad / Mayfish","Sábalo común / Sabalo","Alose vraie / Grande alose","ASD","EN (Portugal)",27,"O sável e a savelha distinguem-se principalmente pelo número e características das branquispinhas do primeiro arco branquial. No entanto, ocorrem exemplares híbridos na Natureza nos quais o número de branquispinhas poderá ser intermédio. No sável o número de branquispinhas é de 85 a 130, compridas, finas, numerosas e mais longas do que os filamentos branquiais; número de escamas na linha lateral 70 a 80; a coloração é azul escura no dorso e flancos prateados, por vezes, tem uma mancha escura na parte posterior do opérculo, podendo apresentar várias pontuações no dorso. Adulto"],["Alosa fallax","Savelha","","Clupeidae","Clupeiformes","Twaite shad / Twait Shad","Saboga / Alosa","Alose feinte","TSD","VU (Portugal); LC",28,"Na savelha o número de branquispinhas é de 30 a 80, são curtas, espessas e comprimento semelhante ao dos filamentos branquiais; número de escamas na linha lateral 60 a 65; coloração azul esverdeada no dorso e prateada no ventre, apresenta uma série de manchas negras na parte superior dos flancos. Estas duas espécies diferem da sardinha pela presença de uma chanfradura mediana na maxila superior e ausência de raios mais desenvolvidos que os outros na barbatana anal; a parte posterior do maxilar situa-se atrás da vertical que passa pelo meio do olho."],["Anguilla anguilla","Enguia-europeia","","Anguillidae","Anguilliformes","European eel","An const isSpecies=lat=>/^[A-Z][a-z]+ [a-z]+$/.test(lat||'')&&!/ spp$/.test(lat);
const genusOf=lat=>(lat||'').split(' ')[0];
function lawOf(lat){
  const g=genusOf(lat),sp=isSpecies(lat),md=new Date().toISOString().slice(5,10);
  const min=sp?(LAW.min[lat]||LAW.genus[g]||''):(LAW.genus[g]||'');
  const banned=sp?(LAW.ban.sp.includes(lat)||LAW.ban.genus.includes(g)):LAW.ban.genus.includes(g);
  const def=LAW.def.filter(d=>sp?d.lat.includes(lat):d.lat.some(x=>genusOf(x)===g)).map(d=>({...d,who:sp?'':d.lat.filter(x=>genusOf(x)===g).join(', '),now:md>=d.from&&md<=d.to}));
  return{min,banned,def};
}
function legalOf(name,sub){
  const lat=latinOf(name,sub),f=fishRow(name),ks=LKEY(name,sub),L=lawOf(lat);
  const min=L.min||ks.map(k=>LEGAL.min[k]).find(Boolean)||'';
  const banned=L.banned||ks.some(k=>LEGAL.banned[k]);
  const note=f&&LEGAL.note[f[0]]&&!banned?LEGAL.note[f[0]][lang]:'';
  return{min,banned,def:L.def,note};
}
function legalHtml(L){
  return [L.note?'<p class="sp-warn">'+esc(L.note)+'</p>':'',L.banned?'<p class="sp-ban">'+esc(t('spBanned'))+'</p>':'',
    L.min?'<p><b>'+esc(t('spMin'))+':</b> '+esc(L.min)+(L.min.endsWith('*')?' <span class="hint">'+esc(t('spMantle'))+'</span>':'')+'</p>':'<p class="hint">'+esc(t('spNoMin'))+'</p>',
    ...L.def.map(d=>'<p class="'+(d.now?'sp-ban':'')+'"><b>'+esc(t('spDefeso'))+(d.who?' ('+esc(d.who)+')':'')+':</b> '+esc(dm(d.from))+' – '+esc(dm(d.to))+' · '+esc(d.area[lang])+(d.now?' · '+esc(t('spNow')):'')+'</p>')].join('');
}

/* ===== Photos v4: iNaturalist allows about one request a second, so requests wait in a queue (gallery first),
   failures are retried later, and answers are kept in this browser for 30 days ===== */
const INQ={hi:[],lo:[],busy:false,last:0};
function inatGet(url,hi){
  return new Promise(res=>{(hi?INQ.hi:INQ.lo).push({url,res});inatPump()});
}
async function inatPump(){
  if(INQ.busy)return;INQ.busy=true;
  while(INQ.hi.length||INQ.lo.length){
    const job=INQ.hi.shift()||INQ.lo.shift();
    const wait=700-(Date.now()-INQ.last);if(wait>0)await new Promise(r=>setTimeout(r,wait));
    INQ.last=Date.now();
    let out=null;
    for(let tr=0;tr<3&&!out;tr++){
      try{const r=await fetch(job.url);if(r.status===429){await new Promise(z=>setTimeout(z,4000*(tr+1)));continue}out=r.ok?await r.json():{results:[]}}catch(e){await new Promise(z=>setTimeout(z,1500))}
    }
    job.res(out);
  }
  INQ.busy=false;
}

/* search & filters fold like "Mar e tempo"; remembers open state, a dot shows when filters are active */
(function(){const c=document.getElementById('srCard');if(!c)return;
  try{if(localStorage.getItem('sn-sr-open')==='1')c.open=true}catch(e){}
  c.addEventListener('toggle',()=>{try{localStorage.setItem('sn-sr-open',c.open?'1':'0')}catch(e){}if(c.open&&matchMedia('(hover:hover) and (pointer:fine)').matches)setTimeout(()=>document.getElementById('q').focus({preventScroll:true}),30)});
  const ids=['q','fSpot','fSpecies','fMonth','fType','fFrom','fTo','fDepthMin','fVis','fTide','fSea','fCurrent','fDir','fWeather','fMood'];
  const upd=()=>{const on=ids.some(i=>{const e=document.getElementById(i);return e&&e.value})||(document.getElementById('fCaught')||{}).checked;document.getElementById('srOn').hidden=!on;document.querySelectorAll('#srCard select').forEach(s=>{if(s._nsSync)s._nsSync()});try{document.getElementById('srOn').title=t('clear')}catch(e){}};
  const dot=document.getElementById('srOn'),clr=ev=>{ev.preventDefault();ev.stopPropagation();dot.classList.add('x');setTimeout(()=>{document.getElementById('clearFilters').click();dot.classList.remove('x');upd()},140)};
  dot.addEventListener('click',clr);dot.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' ')clr(ev)});
  document.addEventListener('input',upd);document.addEventListener('change',upd);document.addEventListener('click',()=>setTimeout(upd,0));upd();
})();
